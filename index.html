<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drug Response Clinical Predictor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const PRESETS = [
      { label: "High Na/K Ratio", age: 34, sex: "M", bp: "HIGH", chol: "NORMAL", naToK: 24.2, desc: "Classic DrugY candidate (>15)" },
      { label: "Young High-BP", age: 31, sex: "F", bp: "HIGH", chol: "NORMAL", naToK: 11.5, desc: "Age <= 50 + High BP -> drugA" },
      { label: "Elderly High-BP", age: 64, sex: "M", bp: "HIGH", chol: "HIGH", naToK: 10.8, desc: "Age > 50 + High BP -> drugB" },
      { label: "Low BP + High Chol", age: 47, sex: "F", bp: "LOW", chol: "HIGH", naToK: 12.1, desc: "Low BP + High Chol -> drugC" },
      { label: "Normal BP Baseline", age: 42, sex: "M", bp: "NORMAL", chol: "NORMAL", naToK: 9.6, desc: "Normal BP -> drugX" }
    ];

    const DRUG_DETAILS = {
      DrugY: { name: "DrugY", title: "Targeted High Na-K Modulator", color: "from-emerald-500 to-teal-600", badge: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30", text: "text-emerald-400" },
      drugA: { name: "drugA", title: "Vasodilator Regimen A", color: "from-blue-500 to-indigo-600", badge: "bg-blue-500/20 text-blue-300 border-blue-500/30", text: "text-blue-400" },
      drugB: { name: "drugB", title: "Cardiovascular Stabilizer B", color: "from-purple-500 to-indigo-600", badge: "bg-purple-500/20 text-purple-300 border-purple-500/30", text: "text-purple-400" },
      drugC: { name: "drugC", title: "Lipid-Hypertensive Therapy C", color: "from-amber-500 to-orange-600", badge: "bg-amber-500/20 text-amber-300 border-amber-500/30", text: "text-amber-400" },
      drugX: { name: "drugX", title: "Standard Care Analgesic X", color: "from-cyan-500 to-blue-600", badge: "bg-cyan-500/20 text-cyan-300 border-cyan-500/30", text: "text-cyan-400" }
    };

    function App() {
      const [age, setAge] = useState(35);
      const [sex, setSex] = useState("M");
      const [bp, setBp] = useState("HIGH");
      const [chol, setChol] = useState("NORMAL");
      const [naToK, setNaToK] = useState(18.5);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [age, sex, bp, chol, naToK]);

      // Mimics Decision Tree decision boundaries from drug200 dataset
      const inference = useMemo(() => {
        const probs = { DrugY: 0.02, drugA: 0.02, drugB: 0.02, drugC: 0.02, drugX: 0.02 };
        const trace = [];

        if (naToK > 15.0) {
          probs.DrugY = 0.94;
          trace.push(`Na_to_K (${naToK.toFixed(1)}) is strictly > 15.0`);
          trace.push("Primary criterion satisfied -> Prescribe DrugY");
        } else {
          trace.push(`Na_to_K (${naToK.toFixed(1)}) is <= 15.0 (DrugY ruled out)`);
          if (bp === "HIGH") {
            trace.push("Blood Pressure is HIGH -> Evaluating Age threshold");
            if (age <= 50) {
              probs.drugA = 0.91;
              probs.drugB = 0.05;
              trace.push(`Age (${age}) is <= 50 -> Prescribe drugA`);
            } else {
              probs.drugB = 0.92;
              probs.drugA = 0.04;
              trace.push(`Age (${age}) is > 50 -> Prescribe drugB`);
            }
          } else if (bp === "LOW") {
            trace.push("Blood Pressure is LOW -> Evaluating Cholesterol status");
            if (chol === "HIGH") {
              probs.drugC = 0.90;
              probs.drugX = 0.06;
              trace.push("Cholesterol is HIGH -> Prescribe drugC");
            } else {
              probs.drugX = 0.88;
              probs.drugC = 0.08;
              trace.push("Cholesterol is NORMAL -> Prescribe drugX");
            }
          } else {
            probs.drugX = 0.91;
            probs.DrugY = 0.03;
            trace.push("Blood Pressure is NORMAL -> Prescribe drugX");
          }
        }

        const topDrugKey = Object.keys(probs).reduce((a, b) => probs[a] > probs[b] ? a : b);
        return {
          topDrug: DRUG_DETAILS[topDrugKey],
          confidence: (probs[topDrugKey] * 100).toFixed(1),
          probabilities: probs,
          trace
        };
      }, [age, sex, bp, chol, naToK]);

      return (
        <div className="max-w-6xl mx-auto px-4 py-8">
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-slate-800 pb-6">
            <div>
              <div className="flex items-center gap-2 text-indigo-400 text-sm font-semibold tracking-wide uppercase">
                <i data-lucide="activity" className="w-4 h-4"></i> Clinical Decision Support System
              </div>
              <h1 className="text-3xl font-extrabold tracking-tight text-white mt-1">
                Drug Response Clinical Predictor
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Rule-optimized inference engine calibrated on the <code>drug200</code> clinical dataset.
              </p>
            </div>
            <div className="flex items-center gap-2 bg-slate-800/80 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              ML Model State: Ready & Calibrated
            </div>
          </div>

          {/* Quick Presets */}
          <div className="mb-8">
            <p className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">
              Load Preset Clinical Cohort
            </p>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
              {PRESETS.map((p, idx) => (
                <button
                  key={idx}
                  onClick={() => {
                    setAge(p.age);
                    setSex(p.sex);
                    setBp(p.bp);
                    setChol(p.chol);
                    setNaToK(p.naToK);
                  }}
                  className="text-left p-3 rounded-lg bg-slate-800/60 hover:bg-slate-700/60 border border-slate-700/60 transition group"
                >
                  <div className="text-xs font-semibold text-slate-200 group-hover:text-indigo-400">{p.label}</div>
                  <div className="text-[11px] text-slate-400 truncate mt-1">{p.desc}</div>
                </button>
              ))}
            </div>
          </div>

          {/* Main Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Input Form Column */}
            <div className="lg:col-span-6 bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-xl backdrop-blur">
              <h2 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                <i data-lucide="sliders" className="w-5 h-5 text-indigo-400"></i> Patient Parameters
              </h2>

              <div className="space-y-6">
                {/* Age Slider */}
                <div>
                  <div className="flex justify-between text-sm mb-2">
                    <span className="text-slate-300 font-medium">Patient Age</span>
                    <span className="font-mono font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">{age} yrs</span>
                  </div>
                  <input
                    type="range"
                    min="10"
                    max="90"
                    value={age}
                    onChange={(e) => setAge(Number(e.target.value))}
                    className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                  />
                  <div className="flex justify-between text-[11px] text-slate-400 mt-1">
                    <span>10</span>
                    <span className="text-amber-400">Cutoff: 50 yrs</span>
                    <span>90</span>
                  </div>
                </div>

                {/* Na to K Ratio Slider */}
                <div>
                  <div className="flex justify-between text-sm mb-2">
                    <span className="text-slate-300 font-medium">Sodium to Potassium (Na_to_K) Ratio</span>
                    <span className="font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">{naToK.toFixed(1)}</span>
                  </div>
                  <input
                    type="range"
                    min="5"
                    max="40"
                    step="0.1"
                    value={naToK}
                    onChange={(e) => setNaToK(Number(e.target.value))}
                    className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                  />
                  <div className="flex justify-between text-[11px] text-slate-400 mt-1">
                    <span>5.0</span>
                    <span className="text-emerald-400 font-semibold">Critical Threshold: 15.0</span>
                    <span>40.0</span>
                  </div>
                </div>

                {/* Sex Selector */}
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Biological Sex</label>
                  <div className="grid grid-cols-2 gap-3">
                    {["M", "F"].map((s) => (
                      <button
                        key={s}
                        type="button"
                        onClick={() => setSex(s)}
                        className={`py-2 rounded-lg font-semibold text-sm border transition ${
                          sex === s
                            ? "bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30"
                            : "bg-slate-700/50 border-slate-600 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        {s === "M" ? "Male (M)" : "Female (F)"}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Blood Pressure Selector */}
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Blood Pressure (BP)</label>
                  <div className="grid grid-cols-3 gap-2">
                    {["LOW", "NORMAL", "HIGH"].map((val) => (
                      <button
                        key={val}
                        type="button"
                        onClick={() => setBp(val)}
                        className={`py-2 text-xs font-semibold rounded-lg border transition ${
                          bp === val
                            ? "bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30"
                            : "bg-slate-700/50 border-slate-600 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        {val}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Cholesterol Selector */}
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Cholesterol Level</label>
                  <div className="grid grid-cols-2 gap-3">
                    {["NORMAL", "HIGH"].map((val) => (
                      <button
                        key={val}
                        type="button"
                        onClick={() => setChol(val)}
                        className={`py-2 text-xs font-semibold rounded-lg border transition ${
                          chol === val
                            ? "bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30"
                            : "bg-slate-700/50 border-slate-600 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        {val}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Prediction Output Column */}
            <div className="lg:col-span-6 space-y-6">
              {/* Prescribed Drug Card */}
              <div className={`p-6 rounded-2xl bg-gradient-to-br ${inference.topDrug.color} text-white shadow-2xl relative overflow-hidden`}>
                <div className="absolute right-[-20px] top-[-20px] opacity-10">
                  <i data-lucide="shield-alert" className="w-56 h-56 text-white"></i>
                </div>
                <div className="relative z-10">
                  <div className="flex justify-between items-start">
                    <span className="text-xs uppercase font-bold tracking-wider px-2.5 py-1 bg-black/20 rounded-full border border-white/20">
                      Primary Recommendation
                    </span>
                    <span className="text-2xl font-black font-mono">{inference.confidence}% Confidence</span>
                  </div>
                  <h3 className="text-5xl font-black tracking-tight mt-4">{inference.topDrug.name}</h3>
                  <p className="text-white/80 font-medium text-sm mt-1">{inference.topDrug.title}</p>
                </div>
              </div>

              {/* Multiclass Probabilities Distribution */}
              <div className="bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h4 className="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                  <i data-lucide="bar-chart-2" className="w-4 h-4 text-indigo-400"></i> Model Probability Distribution
                </h4>
                <div className="space-y-3">
                  {Object.entries(inference.probabilities).map(([drugKey, prob]) => {
                    const pct = (prob * 100).toFixed(1);
                    const isSelected = drugKey === inference.topDrug.name;
                    return (
                      <div key={drugKey}>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className={isSelected ? "text-white font-bold" : "text-slate-400"}>
                            {drugKey} {isSelected && "★"}
                          </span>
                          <span className="font-mono text-slate-300">{pct}%</span>
                        </div>
                        <div className="w-full bg-slate-700/60 rounded-full h-2.5 overflow-hidden">
                          <div
                            className={`h-2.5 rounded-full transition-all duration-300 ${isSelected ? "bg-indigo-500" : "bg-slate-600"}`}
                            style={{ width: `${pct}%` }}
                          ></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Decision Trace Breakdown */}
              <div className="bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h4 className="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                  <i data-lucide="git-branch" className="w-4 h-4 text-emerald-400"></i> Explainable Decision Trace
                </h4>
                <div className="space-y-2">
                  {inference.trace.map((step, idx) => (
                    <div key={idx} className="flex items-center gap-2.5 text-xs text-slate-300">
                      <span className="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[10px] font-bold text-slate-300">
                        {idx + 1}
                      </span>
                      <span>{step}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
